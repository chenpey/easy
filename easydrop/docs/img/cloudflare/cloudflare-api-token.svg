<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">EasyDrop Cloudflare API Token 配置示意图</title>
  <desc id="desc">从 My Profile 的 API Tokens 创建 Custom Token，配置 EasyDrop 部署所需的账号权限、可选域名权限和资源范围。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324d" flood-opacity=".12"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:40px;font-weight:750}.heading{font-size:29px;font-weight:720}.body{font-size:24px}.small{font-size:20px}.tiny{font-size:18px}.muted{fill:#687387}.white{fill:#fff}.orange{fill:#d96500}.blue{fill:#1769e0}.green{fill:#087f5b}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1600" height="1220" fill="#f5f7fb"/>
  <text x="70" y="70" class="title">Cloudflare API Token：创建位置、权限和资源范围</text>
  <text x="70" y="108" class="small muted">这是 User API Token，不是 Global API Key、R2 S3 Access Key、Account ID 或共享登录密码。</text>

  <rect x="70" y="145" width="1460" height="142" rx="18" fill="#fff" filter="url(#shadow)"/>
  <circle cx="115" cy="199" r="24" fill="#f48120"/><text x="107" y="208" class="heading white">1</text>
  <text x="162" y="195" class="heading">打开 Custom Token 表单</text>
  <text x="162" y="238" class="body mono">My Profile → API Tokens → Create Token → Create Custom Token</text>
  <text x="162" y="270" class="small muted">Token name 示例：easydrop-deploy。不要使用 Global API Key 或 R2 专用 S3 Token。</text>

  <rect x="70" y="315" width="1460" height="478" rx="18" fill="#fff" filter="url(#shadow)"/>
  <circle cx="115" cy="369" r="24" fill="#f48120"/><text x="107" y="378" class="heading white">2</text>
  <text x="162" y="365" class="heading">Permissions：先添加 4 项账号权限</text>
  <rect x="130" y="405" width="1340" height="250" rx="12" fill="#fafbfc" stroke="#d7dee8"/>
  <text x="170" y="446" class="small muted">Scope</text><text x="410" y="446" class="small muted">Permission</text><text x="970" y="446" class="small muted">Level</text><text x="1120" y="446" class="small muted">用途</text>
  <line x1="155" y1="462" x2="1445" y2="462" stroke="#d7dee8"/>
  <g class="body">
    <text x="170" y="502">Account</text><text x="410" y="502">Account Settings</text><text x="970" y="502" class="blue">Read</text><text x="1120" y="502" class="green">自动发现账号</text>
    <text x="170" y="548">Account</text><text x="410" y="548">Workers Scripts</text><text x="970" y="548" class="orange">Edit</text><text x="1120" y="548" class="green">部署 Worker / Secret</text>
    <text x="170" y="594">Account</text><text x="410" y="594">D1</text><text x="970" y="594" class="orange">Edit</text><text x="1120" y="594" class="green">建库与迁移</text>
  </g>
  <text x="170" y="638" class="body">Account</text><text x="410" y="638" class="body">Workers R2 Storage</text><text x="970" y="638" class="body orange">Edit</text><text x="1120" y="638" class="body green">建桶与隐私检查</text>

  <rect x="130" y="672" width="1340" height="95" rx="12" fill="#eef5ff" stroke="#b9d4ff"/>
  <text x="170" y="708" class="body blue" font-weight="700">只在使用 Custom Domain 时追加</text>
  <text x="170" y="745" class="small">Zone / Zone / Read　＋　Zone / Workers Routes / Read（Wrangler 冲突检查）</text>

  <rect x="70" y="821" width="1460" height="264" rx="18" fill="#fff" filter="url(#shadow)"/>
  <circle cx="115" cy="875" r="24" fill="#f48120"/><text x="107" y="884" class="heading white">3</text>
  <text x="162" y="871" class="heading">Resources：限制到本项目使用的账号与 Zone</text>
  <text x="162" y="920" class="body">Account Resources：<tspan class="mono">Include → Specific account → 目标账号</tspan></text>
  <text x="162" y="967" class="body">Zone Resources（仅自定义域名）：<tspan class="mono">Include → Specific zone → example.com</tspan></text>
  <text x="162" y="1014" class="small muted">使用 workers.dev 时不需要 Zone 权限；Account Settings Read 可省略，但部署时必须手工输入 32 位 Account ID。</text>
  <rect x="162" y="1034" width="620" height="36" rx="8" fill="#fff4e9" stroke="#f0b27a"/>
  <text x="180" y="1059" class="tiny orange">不要选择 All accounts / All zones，除非你明确接受扩大权限范围。</text>

  <rect x="70" y="1113" width="1460" height="70" rx="14" fill="#f0faf6" stroke="#9bd3be"/>
  <text x="105" y="1143" class="body green" font-weight="700">Continue to summary → 核对 → Create Token</text>
  <text x="105" y="1171" class="small muted">Token secret 只显示一次：存入密码管理器，部署时粘贴到终端隐藏输入；不要写入仓库或环境变量。</text>
</svg>
