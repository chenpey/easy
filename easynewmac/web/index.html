<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="在旧 Mac 本地扫描应用并生成迁移安装脚本"
    />
    <title>EasyNewMac</title>
    <link rel="icon" type="image/svg+xml" href="easynewmac-icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-apps" viewBox="0 0 24 24">
        <rect width="7" height="7" x="3" y="3" rx="1"></rect>
        <rect width="7" height="7" x="14" y="3" rx="1"></rect>
        <rect width="7" height="7" x="14" y="14" rx="1"></rect>
        <rect width="7" height="7" x="3" y="14" rx="1"></rect>
      </symbol>
      <symbol id="icon-wand" viewBox="0 0 24 24">
        <path d="m15 4 5 5L7 22l-5-5Z"></path>
        <path d="m14 5 5 5"></path>
        <path d="m6 9-3 1"></path>
        <path d="m6 5-2-2"></path>
        <path d="M14 3V0"></path>
        <path d="M18 5l2-2"></path>
        <path d="m20 10 3-1"></path>
      </symbol>
      <symbol id="icon-package" viewBox="0 0 24 24">
        <path d="m7.5 4.27 9 5.15"></path>
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
        <path d="m3.3 7 8.7 5 8.7-5"></path>
        <path d="M12 22V12"></path>
      </symbol>
      <symbol id="icon-store" viewBox="0 0 24 24">
        <path d="m2 7 4-4h12l4 4"></path>
        <path d="M5 21V10h14v11"></path>
        <path d="M2 7h20"></path>
        <path d="M8 10v3a4 4 0 0 0 8 0v-3"></path>
      </symbol>
      <symbol id="icon-terminal" viewBox="0 0 24 24">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" x2="20" y1="19" y2="19"></line>
      </symbol>
      <symbol id="icon-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20"></path>
        <path d="M12 2a15 15 0 0 1 0 20"></path>
        <path d="M12 2a15 15 0 0 0 0 20"></path>
      </symbol>
      <symbol id="icon-hand" viewBox="0 0 24 24">
        <path d="M18 11V6a2 2 0 0 0-4 0v5"></path>
        <path d="M14 10V4a2 2 0 0 0-4 0v7"></path>
        <path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path>
        <path d="M6 14v-2a2 2 0 1 0-4 0v4a6 6 0 0 0 6 6h5a8 8 0 0 0 8-8v-2a2 2 0 1 0-4 0v-1"></path>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" x2="12" y1="15" y2="3"></line>
      </symbol>
      <symbol id="icon-check-all" viewBox="0 0 24 24">
        <path d="m12 15 2 2 4-4"></path>
        <rect width="14" height="14" x="8" y="8" rx="2"></rect>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </symbol>
      <symbol id="icon-code" viewBox="0 0 24 24">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <path d="M10.3 2.9 1.8 17a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 2.9a2 2 0 0 0-3.4 0Z"></path>
        <line x1="12" x2="12" y1="9" y2="13"></line>
        <line x1="12" x2="12.01" y1="17" y2="17"></line>
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="easynewmac-icon.svg" alt="" />
          </span>
          <div>
            <h1>EasyNewMac</h1>
            <p id="scanSource">正在读取本地扫描结果</p>
          </div>
        </div>
        <div class="privacy-note">
          <span class="privacy-dot" aria-hidden="true"></span>
          扫描清单仅保存在本机
        </div>
      </header>

      <section class="scan-status" id="scanStatus" aria-live="polite">
        <img src="easynewmac-icon.svg" alt="" />
        <h2>正在扫描这台 Mac</h2>
        <p>应用列表准备完成后会自动显示</p>
        <div class="scan-progress" aria-label="正在扫描"></div>
      </section>

      <main class="workspace" id="workspace" hidden>
        <aside class="sidebar" aria-label="应用分类">
          <div class="sidebar-label">分类</div>
          <nav id="filterNav"></nav>
          <div class="sidebar-footer">
            <span id="scanCount">0</span>
            <span>个扫描项目</span>
          </div>
        </aside>

        <section class="library" aria-labelledby="libraryTitle">
          <div class="library-toolbar">
            <div class="search-field">
              <svg aria-hidden="true"><use href="#icon-search"></use></svg>
              <input
                id="searchInput"
                type="search"
                placeholder="搜索名称、标识或路径"
                autocomplete="off"
                spellcheck="false"
                aria-label="搜索应用"
              />
            </div>
            <div class="toolbar-actions">
              <button class="quiet-button" id="selectVisibleButton" type="button">
                <svg aria-hidden="true"><use href="#icon-check-all"></use></svg>
                选择当前结果
              </button>
              <button
                class="icon-button"
                id="clearSelectionButton"
                type="button"
                title="清空选择"
                aria-label="清空选择"
              >
                <svg aria-hidden="true"><use href="#icon-x"></use></svg>
              </button>
            </div>
          </div>

          <div class="list-heading">
            <div>
              <h2 id="libraryTitle">全部项目</h2>
              <p id="resultSummary">0 个结果</p>
            </div>
            <button class="text-button" id="selectAutomaticButton" type="button">
              选择全部可自动安装
            </button>
          </div>

          <div class="app-list" id="appList" role="list"></div>
          <div class="empty-state" id="emptyState" hidden>
            <svg aria-hidden="true"><use href="#icon-search"></use></svg>
            <strong>没有匹配项目</strong>
            <span>调整搜索词或分类后重试</span>
          </div>
        </section>

        <aside class="plan" aria-labelledby="planTitle">
          <div class="plan-header">
            <div>
              <h2 id="planTitle">迁移计划</h2>
              <p id="selectedSummary">尚未选择项目</p>
            </div>
            <span class="selection-count" id="selectionCount">0</span>
          </div>

          <div class="metric-grid" aria-label="选择统计">
            <div>
              <span>自动安装</span>
              <strong id="automaticCount">0</strong>
            </div>
            <div>
              <span>网页应用</span>
              <strong id="pwaCount">0</strong>
            </div>
            <div>
              <span>手动安装</span>
              <strong id="manualCount">0</strong>
            </div>
          </div>

          <div class="dependency-status" id="dependencyStatus">
            <svg aria-hidden="true"><use href="#icon-package"></use></svg>
            <div>
              <strong>无需 Homebrew</strong>
              <span>选择可自动安装项目后会自动加入</span>
            </div>
          </div>

          <div class="preview-heading">
            <div>
              <svg aria-hidden="true"><use href="#icon-code"></use></svg>
              <h3>脚本预览</h3>
            </div>
            <span>只读</span>
          </div>
          <pre class="script-preview"><code id="scriptPreview"></code></pre>

          <button class="primary-button" id="downloadButton" type="button" disabled>
            <svg aria-hidden="true"><use href="#icon-download"></use></svg>
            下载迁移脚本
          </button>
          <p class="export-note">
            自动项目由脚本安装；网页应用仅保留宿主浏览器和重建地址。<br />
            下载为 ZIP 以保留执行权限，解压后可直接双击运行。
          </p>
        </aside>
      </main>

      <section class="load-error" id="loadError" hidden>
        <svg aria-hidden="true"><use href="#icon-alert"></use></svg>
        <h2>请从 EasyNewMac.app 启动</h2>
        <p>选择页面需要先读取这台 Mac 的本地扫描结果。</p>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
