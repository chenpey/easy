<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyNewMac</title>
    <link rel="icon" type="image/svg+xml" href="easynewmac-icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          sans-serif;
        letter-spacing: 0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background: #f5f5f7;
        color: #1d1d1f;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }

      .mark {
        width: 48px;
        height: 48px;
        border-radius: 11px;
        overflow: hidden;
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        line-height: 24px;
      }

      p {
        color: #6e6e73;
        font-size: 13px;
        line-height: 20px;
      }

      .progress {
        width: 160px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.08);
      }

      .progress::after {
        width: 45%;
        height: 100%;
        display: block;
        border-radius: inherit;
        background: #0071e3;
        content: "";
        animation: scan 1.1s ease-in-out infinite alternate;
      }

      @keyframes scan {
        from {
          transform: translateX(-100%);
        }

        to {
          transform: translateX(225%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          width: 100%;
          animation: none;
          opacity: 0.7;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #161617;
          color: #f5f5f7;
        }

        p {
          color: #a1a1a6;
        }

        .progress {
          background: rgba(255, 255, 255, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <img src="easynewmac-icon.svg" alt="" />
      </div>
      <div>
        <h1>正在扫描这台 Mac</h1>
        <p>应用列表准备完成后会自动显示</p>
      </div>
      <div class="progress" aria-label="正在扫描"></div>
    </main>

    <script src="data.js"></script>
    <script>
      if (window.EASYNEWMAC_SCAN) {
        window.location.replace("index.html");
      } else {
        window.setTimeout(() => window.location.reload(), 800);
      }
    </script>
  </body>
</html>
