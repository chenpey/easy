name: Release EasyNewMac

on:
  push:
    tags:
      - "easynewmac-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        shell: zsh {0}
        run: |
          version="$(<easynewmac/VERSION)"
          tag_version="${GITHUB_REF_NAME#easynewmac-v}"
          [[ "$tag_version" == "$version" ]] || {
            print -u2 -- "标签版本 $tag_version 与 VERSION $version 不一致"
            exit 1
          }

      - name: Test
        shell: zsh {0}
        run: |
          chmod 755 easynewmac/scripts/*.zsh
          easynewmac/scripts/scan-preview.zsh /tmp/easynewmac-release-test >/dev/null
          EASYNEWMAC_SCAN_FIXTURE=/tmp/easynewmac-release-test/data.js \
            node --test easynewmac/test/core.test.cjs
          node scripts/version.mjs check

      - name: Build
        shell: zsh {0}
        run: |
          easynewmac/scripts/build.zsh
          version="$(<easynewmac/VERSION)"
          release_dir="$(mktemp -d)"
          ditto -x -k "easynewmac/dist/EasyNewMac-v${version}.zip" "$release_dir"
          test -x "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Resources/first-open.zsh"
          test -f "$release_dir/EasyNewMac/首次使用.txt"
          test "$(find "$release_dir/EasyNewMac" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "2"
          codesign --verify --deep --strict "$release_dir/EasyNewMac/EasyNewMac.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Info.plist")" = "party.tiandi.easynewmac"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Info.plist")" = "EasyNewMac.icns"
          ! /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Info.plist"
          test ! -e "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Resources/Assets.car"
          test ! -e "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Resources/applet.icns"
          gzip -t "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Resources/catalog/casks.tsv.gz"
          test -f "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Resources/web/easynewmac-icon.svg"
          test ! -e "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Resources/web/loading.html"
          grep -q 'rel="icon".*easynewmac-icon.svg' "$release_dir/EasyNewMac/EasyNewMac.app/Contents/Resources/web/index.html"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          version="$(<easynewmac/VERSION)"
          archive="easynewmac/dist/EasyNewMac-v${version}.zip"
          checksum="${archive}.sha256"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$archive" \
              "$checksum" \
              --verify-tag \
              --title "EasyNewMac v${version}" \
              --notes "发布包已精简为 EasyNewMac.app 和“首次使用.txt”两个文件。首次使用时复制说明中的完整命令到终端并按回车；命令会调用 App 内置授权脚本，自动校验、解除隔离、关闭当前终端标签页并启动应用。" \
              --generate-notes
          fi
