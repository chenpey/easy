[project]
name = "easynews"
version = "1.0.0"
description = "EasyNews：新闻采集、语义筛选、统计与 Excel 台账"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",   # 解析栏目列表与正文
    "openpyxl>=3.1",          # 直接导出 Excel 台账与统计
]

[tool.uv]
package = false            # 纯脚本工程，不需要打包安装自己
