<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare R2 启用路径示意图</title>
  <desc id="desc">在 Cloudflare 账号级控制台中进入 Storage and databases、R2、Overview，并完成 R2 subscription 启用流程。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324d" flood-opacity=".12"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:38px;font-weight:740}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.small{font-size:20px}.muted{fill:#687387}.white{fill:#fff}.orange{fill:#d96500}.green{fill:#087f5b}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f5f7fb"/>
  <rect x="38" y="34" width="1324" height="792" rx="18" fill="#fff" filter="url(#shadow)"/>
  <rect x="38" y="34" width="1324" height="82" rx="18" fill="#fafbfc"/>
  <circle cx="78" cy="75" r="12" fill="#ff625d"/><circle cx="118" cy="75" r="12" fill="#ffc043"/><circle cx="158" cy="75" r="12" fill="#32c759"/>
  <rect x="225" y="55" width="1040" height="40" rx="20" fill="#fff" stroke="#d9e1ed"/>
  <text x="260" y="82" class="small muted">dash.cloudflare.com › 目标账号 › Storage &amp; databases › R2 › Overview</text>

  <rect x="38" y="116" width="308" height="710" fill="#101828"/>
  <text x="76" y="178" class="title white">CLOUDFLARE</text>
  <text x="76" y="242" class="body" fill="#c9d4e3">Workers &amp; Pages</text>
  <rect x="56" y="276" width="272" height="62" rx="10" fill="#263b58"/>
  <text x="76" y="315" class="body white" font-weight="700">Storage &amp; databases</text>
  <rect x="76" y="354" width="232" height="56" rx="10" fill="#1769e0"/>
  <text x="98" y="390" class="body white" font-weight="700">R2</text>
  <text x="98" y="448" class="body" fill="#c9d4e3">D1</text>
  <text x="98" y="506" class="body" fill="#c9d4e3">KV</text>

  <text x="392" y="180" class="title">R2 object storage</text>
  <text x="392" y="222" class="body muted">先启用账号的 R2 服务；部署脚本随后自动创建私有 bucket。</text>
  <rect x="392" y="266" width="900" height="238" rx="16" fill="#fbfcfe" stroke="#d7dee8"/>
  <circle cx="446" cy="326" r="24" fill="#f48120"/><text x="438" y="335" class="heading white">1</text>
  <text x="492" y="322" class="heading">首次进入时完成启用流程</text>
  <text x="492" y="365" class="body">选择 Add R2 subscription / Get started / Continue</text>
  <text x="492" y="405" class="small muted">按钮文案可能随账号地区变化；按页面核对免费额度和付款信息。</text>
  <rect x="492" y="438" width="310" height="48" rx="8" fill="#f48120"/>
  <text x="647" y="470" class="body white" text-anchor="middle" font-weight="700">启用 R2</text>

  <rect x="392" y="536" width="900" height="186" rx="16" fill="#f0faf6" stroke="#9bd3be"/>
  <circle cx="446" cy="594" r="24" fill="#087f5b"/><text x="438" y="603" class="heading white">2</text>
  <text x="492" y="590" class="heading green">成功标准</text>
  <text x="492" y="635" class="body">能打开 R2 Overview，并看到 Create bucket 按钮。</text>
  <text x="492" y="675" class="small muted">不要手工创建 bucket；deploy.sh 会按 Worker 名称创建并保持私有。</text>

  <rect x="392" y="752" width="900" height="48" rx="10" fill="#fff4e9" stroke="#f0b27a"/>
  <text x="420" y="784" class="small orange">启用 R2 不等于购买 Workers Paid；R2 Standard 仍先使用月度免费额度。</text>
</svg>
