<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 | localShare</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body data-page="login">
  <main class="login-layout">
    <div class="brand"><i data-lucide="share-2"></i><h1>localShare</h1></div>
    <h2>登录</h2>
    <form id="login-form">
      <label for="password">共享密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus>
      <button class="primary" type="submit"><i data-lucide="log-in"></i><span>登录</span></button>
    </form>
    <div id="notice" role="status" aria-live="polite"></div>
    <details id="error-details" hidden><summary>错误详情</summary><pre id="error-body"></pre></details>
  </main>
</body>
</html>
